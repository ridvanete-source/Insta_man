name: Auto-post queue

on:
  # schedule paused 2026-09-10: user reports the same Story being posted
  # hourly since the night before - root cause not yet confirmed (see
  # CLAUDE.md / commit history). Re-enable once diagnosed and fixed.
  # schedule:
  #   - cron: "13 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "instagrapi>=2.18"
          pip install -e .

      - name: Write .env
        run: |
          cat > .env << EOF
          INSTA_MAN_PUBLISHER=instagrapi
          INSTA_MAN_QUEUE_FILE=content_library/queue.yaml
          INSTA_MAN_MAX_HASHTAGS=25
          INSTA_MAN_TIMEZONE=Europe/Istanbul
          IG_USERNAME=${{ secrets.IG_USERNAME }}
          IG_PASSWORD=${{ secrets.IG_PASSWORD }}
          IG_SESSION_FILE=.ig_session.json
          NOTIFY_EMAIL_ENABLED=true
          NOTIFY_EMAIL_TO=${{ secrets.NOTIFY_EMAIL_TO }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD=${{ secrets.SMTP_APP_PASSWORD }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          EOF

      - name: Restore Instagram session
        run: echo "${{ secrets.IG_SESSION_B64 }}" | base64 -d > .ig_session.json

      - name: Run due posts
        id: run_step
        run: python -m insta_man.cli run
        continue-on-error: true

      - name: Commit queue updates
        if: always()
        run: |
          git config user.name "insta-man-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content_library/queue.yaml content_library/health_state.json
          git diff --cached --quiet || git commit -m "chore: update queue status [skip ci]"
          git push

      - name: Fail job if the run step failed
        if: steps.run_step.outcome == 'failure'
        run: exit 1
