# Seed hashtag pools, organized by topic and by reach tier.
#
# Tiers:
#   mega   -> extremely broad tags (>1M posts). High reach, high competition,
#             your post disappears from the feed within minutes.
#   medium -> mid-size tags (~50k-1M posts). Best reach-to-competition ratio.
#   niche  -> small, specific tags (<50k posts). Slower but more targeted
#             engagement, better chance of hitting "top posts".
#
# Hesabın kesin niş/konusu henüz seçilmediği için burada Instagram'da en
# yaygın kullanılan içerik kategorileri gerçek, bilinen hashtag'lerle
# dolduruldu. Niş netleşince: (a) o kategoriyi olduğu gibi kullanabilir,
# (b) altına daha spesifik alt-etiketler ekleyebilir, ya da (c) kullanılmayan
# kategorileri silebilirsiniz. `general` her zaman fallback olarak kalır.
# ContentPost.topics alanına buradaki anahtarlardan birini (örn. "fitness")
# yazmak yeterli - HashtagManager geri kalanını otomatik seçer.

general:
  mega: ["instagood", "photooftheday", "instadaily", "picoftheday", "love", "follow", "instagram"]
  medium: ["contentcreator", "dailypost", "instacontent", "creativity", "aesthetic", "goodvibes"]
  niche: ["smallcreator", "growwithus", "contentstrategy", "dailyinspo", "communityovercompetition"]

